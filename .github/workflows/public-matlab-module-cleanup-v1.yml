name: PUBLIC_MATLAB_MODULE_CLEANUP_V1
run-name: Public archived branch cleanup • ${{ github.event.issue.number }}
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: >-
    ${{ github.repository == 'yinghanyang44-yyh/PUBLIC_MATLAB_CI_SMOKE' &&
        github.event.repository.private == false && github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner && github.run_attempt == 1 &&
        !github.event.issue.pull_request && startsWith(github.event.comment.body, '/matlab-module cleanup ') &&
        'public-matlab-module-cleanup-v1' || format('public-cleanup-rejected-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  admit-cleanup:
    if: >-
      github.repository == 'yinghanyang44-yyh/PUBLIC_MATLAB_CI_SMOKE' &&
      github.event.repository.private == false && github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner && github.run_attempt == 1 &&
      !github.event.issue.pull_request && startsWith(github.event.comment.body, '/matlab-module cleanup ')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Check out trusted cleanup infrastructure only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify archived PASS evidence and claim one cleanup attempt
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          MATLAB_CLEANUP_EVIDENCE_DIR: ${{ runner.temp }}/public-module-cleanup
        run: python3 -I ci/module_lab/module_cleanup.py admit
      - name: Retain cleanup admission or rejection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-module-cleanup-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/public-module-cleanup/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: false
  delete-archived-branch:
    needs: admit-cleanup
    if: needs.admit-cleanup.result == 'success' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - name: Check out the same trusted cleanup infrastructure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Restore this run's immutable cleanup admission
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-module-cleanup-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/public-module-cleanup/
      - name: Recheck exact branch head and delete its reference once
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          MATLAB_CLEANUP_EVIDENCE_DIR: ${{ runner.temp }}/public-module-cleanup
        run: python3 -I ci/module_lab/module_cleanup.py delete
      - name: Retain deletion receipt or uncertainty evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-module-cleanup-result-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-module-cleanup/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: false
